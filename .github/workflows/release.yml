name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Build binaries
      env:
        VERSION: ${{ github.ref_name }}
        GOPRIVATE: github.com/ambientlabscomputing/*
        GONOSUMCHECK: github.com/ambientlabscomputing/*
      run: |
        mkdir -p bin
        
        # Linux AMD64
        GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=${VERSION}" -o bin/deployment_engine-linux-amd64 ./cmd/serve
        
        # Linux ARM64
        GOOS=linux GOARCH=arm64 go build -ldflags "-X main.Version=${VERSION}" -o bin/deployment_engine-linux-arm64 ./cmd/serve
        
        # macOS AMD64
        GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.Version=${VERSION}" -o bin/deployment_engine-darwin-amd64 ./cmd/serve
        
        # macOS ARM64 (M1/M2/M3)
        GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.Version=${VERSION}" -o bin/deployment_engine-darwin-arm64 ./cmd/serve

    - name: Generate checksums
      run: |
        cd bin
        sha256sum * > checksums.txt
        cat checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          bin/deployment_engine-*
          bin/checksums.txt
        body: |
          # Deployment Engine ${{ github.ref_name }}
          
          Distributed deployment lifecycle management UMC.
          
          ## Platforms
          
          - **Linux AMD64**: `deployment_engine-linux-amd64`
          - **Linux ARM64**: `deployment_engine-linux-arm64`
          - **macOS AMD64**: `deployment_engine-darwin-amd64`
          - **macOS ARM64**: `deployment_engine-darwin-arm64`
          
          ## Verification
          
          Verify checksums with:
          ```bash
          sha256sum -c checksums.txt
          ```
